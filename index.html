<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顔モザイク</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#ff4d6d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="顔モザイク">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f6f6f4;
    --panel: #ffffff;
    --text: #1d1d1f;
    --muted: #6b6b70;
    --border: #e2e2e0;
    --accent: #ff4d6d;
    --accent-soft: #ffe3e8;
    --off: #8a8a90;
    --drop: #fafaf8;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416;
      --panel: #1e1e21;
      --text: #ececee;
      --muted: #9a9aa2;
      --border: #303035;
      --accent: #ff6b85;
      --accent-soft: #3a1f26;
      --off: #8a8a90;
      --drop: #19191b;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141416; --panel: #1e1e21; --text: #ececee; --muted: #9a9aa2;
    --border: #303035; --accent: #ff6b85; --accent-soft: #3a1f26; --off: #8a8a90;
    --drop: #19191b; --shadow: none;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 18px 16px 8px; max-width: 1200px; margin: 0 auto;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  main { max-width: 1200px; margin: 0 auto; padding: 8px 16px 32px; }

  /* Drop zone */
  #drop {
    border: 2px dashed var(--border); border-radius: 14px; background: var(--drop);
    padding: 56px 16px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop .big { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
  #drop .small { color: var(--muted); margin: 0; font-size: 13px; }

  /* Workspace */
  #work { display: none; gap: 16px; grid-template-columns: minmax(0, 1fr) 280px; align-items: start; }
  #work.show { display: grid; }
  @media (max-width: 820px) { #work.show { grid-template-columns: minmax(0, 1fr); } }

  .stage {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px; box-shadow: var(--shadow); position: relative;
  }
  .canvas-wrap { display: flex; justify-content: center; }
  #view {
    max-width: 100%; max-height: 75vh; height: auto; display: block;
    touch-action: none; cursor: crosshair; border-radius: 6px;
    background: repeating-conic-gradient(var(--border) 0 25%, transparent 0 50%) 0 0 / 16px 16px;
  }
  .hint { color: var(--muted); font-size: 12px; margin: 10px 2px 0; }

  #status {
    display: flex; align-items: center; gap: 8px; margin: 0 0 10px; min-height: 22px;
    font-size: 13px; color: var(--muted);
  }
  #status b { color: var(--text); }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite; display: none;
  }
  #status.busy .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  aside {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px;
  }
  .group h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 8px; letter-spacing: .04em; }

  .seg { display: flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label {
    flex: 1; text-align: center; padding: 6px 4px; cursor: pointer; font-size: 13px;
    border-left: 1px solid var(--border); user-select: none;
  }
  .seg label:first-of-type { border-left: 0; }
  .seg input:checked + label { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }

  .range-row { display: flex; align-items: center; gap: 10px; }
  .range-row input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  .range-row output { width: 36px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .row-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 2px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }

  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; }

  button {
    font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 9px; padding: 7px 10px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 10px; }
  button.primary:hover:not(:disabled) { filter: brightness(1.05); border-color: var(--accent); }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btns .full { grid-column: 1 / -1; }

  .privacy { font-size: 11px; color: var(--muted); margin: 0; }
  .err { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>顔モザイク</h1>
  <p>画像の顔をAIで自動検出してモザイクをかけます。画像はこのブラウザの中だけで処理され、外部には送信されません。</p>
</header>

<main>
  <div id="drop" tabindex="0" role="button" aria-label="画像を選択">
    <p class="big">画像をドロップ、またはクリックして選択</p>
    <p class="small">貼り付け（Ctrl+V）でもOK ・ JPEG / PNG / WebP</p>
  </div>
  <input type="file" id="file" accept="image/*" hidden>

  <div id="work">
    <section class="stage">
      <div id="status"><span class="spinner"></span><span id="statusText"></span></div>
      <div class="canvas-wrap"><canvas id="view"></canvas></div>
      <p class="hint">枠をクリック：モザイクのON/OFF ・ ドラッグ：範囲を追加 ・ Delete：選択中の枠を削除</p>
    </section>

    <aside>
      <div class="group">
        <h2>加工の種類</h2>
        <div class="seg">
          <input type="radio" name="effect" id="ef-mosaic" value="mosaic" checked><label for="ef-mosaic">モザイク</label>
          <input type="radio" name="effect" id="ef-blur" value="blur"><label for="ef-blur">ぼかし</label>
          <input type="radio" name="effect" id="ef-fill" value="fill"><label for="ef-fill">塗りつぶし</label>
        </div>
      </div>

      <div class="group">
        <h2>形</h2>
        <div class="seg">
          <input type="radio" name="shape" id="sh-rect" value="rect" checked><label for="sh-rect">四角</label>
          <input type="radio" name="shape" id="sh-ellipse" value="ellipse"><label for="sh-ellipse">楕円</label>
        </div>
      </div>

      <div class="group stack">
        <div>
          <div class="row-label"><span>粗さ</span></div>
          <div class="range-row">
            <input type="range" id="strength" min="1" max="10" value="6">
            <output id="strengthOut">6</output>
          </div>
        </div>
        <div>
          <div class="row-label"><span>範囲の広さ</span></div>
          <div class="range-row">
            <input type="range" id="padding" min="0" max="60" value="25" step="5">
            <output id="paddingOut">25%</output>
          </div>
        </div>
        <div>
          <div class="row-label"><span>検出感度</span></div>
          <div class="range-row">
            <input type="range" id="sensitivity" min="1" max="9" value="5">
            <output id="sensitivityOut">5</output>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="showFrames" checked>枠を表示（保存画像には入りません）</label>
      </div>

      <div class="group">
        <h2>枠の操作</h2>
        <div class="btns">
          <button id="allOn">すべてON</button>
          <button id="allOff">すべてOFF</button>
          <button id="delSel" class="full" disabled>選択中の枠を削除</button>
        </div>
      </div>

      <div class="group">
        <h2>保存</h2>
        <div class="stack">
          <div class="seg">
            <input type="radio" name="fmt" id="fmt-png" value="png" checked><label for="fmt-png">PNG</label>
            <input type="radio" name="fmt" id="fmt-jpg" value="jpeg"><label for="fmt-jpg">JPEG</label>
          </div>
          <button id="save" class="primary">画像を保存</button>
          <button id="another">別の画像を選ぶ</button>
        </div>
      </div>

      <p class="privacy">顔検出：Google MediaPipe Face Detector（端末内で実行・オフライン対応）</p>
    </aside>
  </div>
</main>

<script type="module">
// Bundled locally (@mediapipe/tasks-vision 0.10.14) so the app works offline.
const LIB_URL   = new URL("vendor/vision_bundle.mjs", location.href).href;
const WASM_URL  = new URL("vendor/wasm", location.href).href;
const MODEL_URL = new URL("vendor/blaze_face_short_range.tflite", location.href).href;

const $ = (id) => document.getElementById(id);
const view = $("view");
const ctx = view.getContext("2d");

const state = {
  img: null,          // HTMLCanvasElement holding the original pixels
  faces: [],          // raw detected boxes (before padding) { x, y, w, h }
  regions: [],        // { x, y, w, h, on, auto, faceIndex? }
  selected: -1,
  drag: null,         // { x0, y0, x1, y1, moved, hit }
};

/* ---------- Status ---------- */
function setStatus(html, busy = false) {
  $("statusText").innerHTML = html;
  $("status").classList.toggle("busy", busy);
}

/* ---------- Detector ---------- */
let detectorPromise = null;
let detectorReady = false;
function getDetector() {
  if (!detectorPromise) {
    detectorPromise = (async () => {
      // Imported lazily so the UI works even while the library is still downloading.
      const { FilesetResolver, FaceDetector } = await import(LIB_URL);
      const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
      // CPU only: the GPU delegate silently returns no faces on some Android
      // GPUs, and for this tiny model the CPU is just as fast.
      return await FaceDetector.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: "CPU" },
        runningMode: "IMAGE",
        minDetectionConfidence: confidence(),
      });
    })();
    detectorPromise.then(() => { detectorReady = true; }, () => { detectorPromise = null; });
  }
  return detectorPromise;
}
// 感度 1..9 → 信頼度しきい値 0.85..0.25
const confidence = () => 0.85 - (Number($("sensitivity").value) - 1) * 0.075;

/* Detect on the full image and on overlapping tiles at several scales,
   so that small faces in group photos are also found. */
async function detectFaces(src) {
  const det = await getDetector();
  await det.setOptions({ minDetectionConfidence: confidence() });
  const W = src.width, H = src.height;
  const boxes = [];
  const tile = document.createElement("canvas");
  const tctx = tile.getContext("2d");

  // Tiles produce more false positives (patterns, hands, etc.), so they need a
  // higher score, and faces that fill most of a tile are left to coarser passes.
  const tileMin = Math.min(0.95, confidence() + 0.2);

  const run = (sx, sy, sw, sh, isTile) => {
    // Downscale big tiles; the model works on 128px input anyway.
    const scale = Math.min(1, 640 / Math.max(sw, sh));
    tile.width = Math.round(sw * scale);
    tile.height = Math.round(sh * scale);
    tctx.drawImage(src, sx, sy, sw, sh, 0, 0, tile.width, tile.height);
    const res = det.detect(tile);
    for (const d of res.detections) {
      const b = d.boundingBox;
      const score = d.categories?.[0]?.score ?? 0;
      if (isTile && (score < tileMin || b.width / tile.width > 0.6)) continue;
      boxes.push({
        x: sx + b.originX / scale,
        y: sy + b.originY / scale,
        w: b.width / scale,
        h: b.height / scale,
        score,
      });
    }
  };

  run(0, 0, W, H, false);
  // The model needs a face to span roughly 15%+ of its input, so shrink the
  // tile size step by step (down to ~1/12 of the image) to catch small faces.
  const minSide = Math.min(W, H);
  const minTile = Math.max(200, Math.max(W, H) / 12);
  let lastTile = 0;
  for (let size = Math.max(W, H) * 0.6; size >= minTile; size *= 0.6) {
    const s = Math.round(Math.min(size, minSide));
    if (s === lastTile) continue;
    lastTile = s;
    const step = Math.round(s * 0.7);
    for (let y = 0; ; y += step) {
      const yy = Math.min(y, H - s);
      for (let x = 0; ; x += step) {
        const xx = Math.min(x, W - s);
        run(xx, yy, s, s, true);
        if (xx >= W - s) break;
      }
      if (yy >= H - s) break;
      await new Promise(r => setTimeout(r)); // keep UI responsive
    }
  }
  return mergeBoxes(boxes);
}

/* Merge overlapping boxes into their union (covering more is safer for privacy). */
function mergeBoxes(boxes) {
  const out = boxes.map(b => ({ ...b }));
  let changed = true;
  while (changed) {
    changed = false;
    for (let i = 0; i < out.length && !changed; i++) {
      for (let j = i + 1; j < out.length; j++) {
        const a = out[i], b = out[j];
        const ix = Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x));
        const iy = Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
        const inter = ix * iy;
        if (inter / Math.min(a.w * a.h, b.w * b.h) > 0.35) {
          const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
          out[i] = {
            x, y,
            w: Math.max(a.x + a.w, b.x + b.w) - x,
            h: Math.max(a.y + a.h, b.y + b.h) - y,
            score: Math.max(a.score, b.score),
          };
          out.splice(j, 1);
          changed = true;
          break;
        }
      }
    }
  }
  return out;
}

/* Detected box → mosaic region (expanded, more toward forehead/hair). */
function padFace(f) {
  const p = Number($("padding").value) / 100;
  const W = state.img.width, H = state.img.height;
  let x = f.x - f.w * p * 0.5;
  let y = f.y - f.h * p * 0.9;
  let w = f.w * (1 + p);
  let h = f.h * (1 + p * 1.3);
  x = Math.max(0, x); y = Math.max(0, y);
  w = Math.min(W - x, w); h = Math.min(H - y, h);
  return { x, y, w, h };
}

/* ---------- Loading ---------- */
async function loadFile(file) {
  if (!file || !file.type.startsWith("image/")) {
    setStatus('<span class="err">画像ファイルを選んでください。</span>');
    return;
  }
  try {
    // imageOrientation "from-image" applies the EXIF rotation of phone photos.
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const c = document.createElement("canvas");
    c.width = bmp.width; c.height = bmp.height;
    c.getContext("2d").drawImage(bmp, 0, 0);
    bmp.close();
    state.img = c;
    state.fileName = file.name || "image";
  } catch (e) {
    setStatus('<span class="err">画像を読み込めませんでした。</span>');
    return;
  }
  view.width = state.img.width;
  view.height = state.img.height;
  state.faces = [];
  state.regions = [];
  state.selected = -1;
  $("drop").style.display = "none";
  $("work").classList.add("show");
  render();
  await redetect();
}

let detectSeq = 0;
async function redetect() {
  if (!state.img) return;
  const seq = ++detectSeq;
  setStatus(detectorReady ? "顔を検出中…" : "AIモデルを読み込み中…（初回のみ数秒かかります）", true);
  try {
    const faces = await detectFaces(state.img);
    if (seq !== detectSeq) return;
    state.faces = faces;
    // Keep manual regions, replace auto ones.
    const manual = state.regions.filter(r => !r.auto);
    state.regions = [
      ...faces.map((f, i) => ({ ...padFace(f), on: true, auto: true, faceIndex: i })),
      ...manual,
    ];
    state.selected = -1;
    updateButtons();
    render();
    showCount();
  } catch (e) {
    console.error(e);
    if (seq === detectSeq) {
      const msg = String(e?.message || e).replace(/[<>&]/g, "");
      setStatus(`<span class="err">顔検出に失敗しました。ページを再読み込みしてください。（${msg}）</span>`);
    }
  }
}

function showCount() {
  const n = state.faces.length;
  const on = state.regions.filter(r => r.on).length;
  setStatus(n
    ? `<b>${n}人</b>の顔を検出しました（モザイク ${on}か所）`
    : `顔が見つかりませんでした。感度を上げるか、ドラッグで範囲を追加してください。（モザイク ${on}か所）`);
}

/* ---------- Effects ---------- */
const scratch = document.createElement("canvas");
const sctx = scratch.getContext("2d");

function applyEffect(g, src, r, effect, strength) {
  const x = Math.round(r.x), y = Math.round(r.y);
  const w = Math.max(1, Math.round(r.w)), h = Math.max(1, Math.round(r.h));
  // strength 1..10 → number of blocks across the shorter side: 24..4
  const blocks = Math.round(24 - (strength - 1) * (20 / 9));
  const block = Math.max(2, Math.min(w, h) / blocks);

  g.save();
  if ($("sh-ellipse").checked) {
    g.beginPath();
    g.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
    g.clip();
  }

  if (effect === "fill") {
    g.fillStyle = "#000";
    g.fillRect(x, y, w, h);
  } else if (effect === "mosaic") {
    const sw = Math.max(1, Math.round(w / block)), sh = Math.max(1, Math.round(h / block));
    scratch.width = sw; scratch.height = sh;
    sctx.imageSmoothingEnabled = true;
    sctx.drawImage(src, x, y, w, h, 0, 0, sw, sh);
    g.imageSmoothingEnabled = false;
    g.drawImage(scratch, 0, 0, sw, sh, x, y, w, h);
  } else {
    // Blur: downscale with smoothing, then upscale with smoothing (two passes for softness).
    const f = block * 0.8;
    const sw = Math.max(1, Math.round(w / f)), sh = Math.max(1, Math.round(h / f));
    scratch.width = sw; scratch.height = sh;
    sctx.imageSmoothingEnabled = true;
    sctx.imageSmoothingQuality = "high";
    // sample a slightly larger area so edges don't look hard
    sctx.drawImage(src, x, y, w, h, 0, 0, sw, sh);
    sctx.drawImage(scratch, 0, 0, sw, sh, 0, 0, Math.max(1, sw >> 1), Math.max(1, sh >> 1));
    sctx.drawImage(scratch, 0, 0, Math.max(1, sw >> 1), Math.max(1, sh >> 1), 0, 0, sw, sh);
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = "high";
    g.drawImage(scratch, 0, 0, sw, sh, x, y, w, h);
  }
  g.restore();
}

function currentEffect() { return document.querySelector('input[name=effect]:checked').value; }

function paint(g, withFrames) {
  const src = state.img;
  g.imageSmoothingEnabled = true;
  g.drawImage(src, 0, 0);
  const effect = currentEffect();
  const strength = Number($("strength").value);
  for (const r of state.regions) if (r.on) applyEffect(g, src, r, effect, strength);
  if (withFrames) drawFrames(g);
}

function drawFrames(g) {
  // keep lines ~2 CSS px regardless of how much the canvas is scaled down
  const k = view.width / Math.max(1, view.getBoundingClientRect().width);
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#ff4d6d";
  state.regions.forEach((r, i) => {
    const sel = i === state.selected;
    g.save();
    g.lineWidth = (sel ? 3.5 : 2) * k;
    g.setLineDash(r.on ? [] : [6 * k, 5 * k]);
    g.strokeStyle = r.on ? accent : "#bbbbc0";
    g.shadowColor = "rgba(0,0,0,.5)";
    g.shadowBlur = 3 * k;
    g.strokeRect(r.x, r.y, r.w, r.h);
    // small label
    const label = r.on ? "ON" : "OFF";
    g.font = `600 ${11 * k}px system-ui, sans-serif`;
    const tw = g.measureText(label).width + 8 * k;
    const th = 16 * k;
    const ly = r.y - th >= 0 ? r.y - th : r.y;
    g.shadowBlur = 0;
    g.setLineDash([]);
    g.fillStyle = r.on ? accent : "#6b6b70";
    g.fillRect(r.x, ly, tw, th);
    g.fillStyle = "#fff";
    g.textBaseline = "middle";
    g.fillText(label, r.x + 4 * k, ly + th / 2);
    g.restore();
  });
  const d = state.drag;
  if (d && d.moved) {
    const x = Math.min(d.x0, d.x1), y = Math.min(d.y0, d.y1);
    g.save();
    g.lineWidth = 2 * k;
    g.setLineDash([6 * k, 4 * k]);
    g.strokeStyle = accent;
    g.fillStyle = "rgba(255,77,109,.15)";
    g.fillRect(x, y, Math.abs(d.x1 - d.x0), Math.abs(d.y1 - d.y0));
    g.strokeRect(x, y, Math.abs(d.x1 - d.x0), Math.abs(d.y1 - d.y0));
    g.restore();
  }
}

let rafPending = false;
function render() {
  if (!state.img || rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    paint(ctx, $("showFrames").checked);
  });
}

/* ---------- Pointer interaction ---------- */
function toImage(e) {
  const rect = view.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (view.width / rect.width),
    y: (e.clientY - rect.top) * (view.height / rect.height),
  };
}
function hitTest(p) {
  for (let i = state.regions.length - 1; i >= 0; i--) {
    const r = state.regions[i];
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return i;
  }
  return -1;
}

view.addEventListener("pointerdown", (e) => {
  if (!state.img || e.button !== 0) return;
  view.setPointerCapture(e.pointerId);
  const p = toImage(e);
  state.drag = { x0: p.x, y0: p.y, x1: p.x, y1: p.y, moved: false, hit: hitTest(p), cx: e.clientX, cy: e.clientY };
});
view.addEventListener("pointermove", (e) => {
  const d = state.drag;
  if (!d) {
    if (state.img) view.style.cursor = hitTest(toImage(e)) >= 0 ? "pointer" : "crosshair";
    return;
  }
  const p = toImage(e);
  d.x1 = Math.max(0, Math.min(view.width, p.x));
  d.y1 = Math.max(0, Math.min(view.height, p.y));
  if (Math.hypot(e.clientX - d.cx, e.clientY - d.cy) > 5) d.moved = true;
  if (d.moved) render();
});
function endDrag() {
  const d = state.drag;
  state.drag = null;
  if (!d) return;
  if (d.moved) {
    const w = Math.abs(d.x1 - d.x0), h = Math.abs(d.y1 - d.y0);
    if (w > 4 && h > 4) {
      state.regions.push({ x: Math.min(d.x0, d.x1), y: Math.min(d.y0, d.y1), w, h, on: true, auto: false });
      state.selected = state.regions.length - 1;
    }
  } else if (d.hit >= 0) {
    state.regions[d.hit].on = !state.regions[d.hit].on;
    state.selected = d.hit;
  } else {
    state.selected = -1;
  }
  updateButtons();
  render();
  showCount();
}
view.addEventListener("pointerup", endDrag);
view.addEventListener("pointercancel", () => { state.drag = null; render(); });

function deleteSelected() {
  if (state.selected < 0) return;
  state.regions.splice(state.selected, 1);
  state.selected = -1;
  updateButtons();
  render();
  showCount();
}
function updateButtons() {
  $("delSel").disabled = state.selected < 0;
}

/* ---------- Controls ---------- */
$("drop").addEventListener("click", () => $("file").click());
$("drop").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });
$("file").addEventListener("change", (e) => { loadFile(e.target.files[0]); e.target.value = ""; });
$("another").addEventListener("click", () => $("file").click());

["dragenter", "dragover"].forEach(t => document.addEventListener(t, (e) => {
  e.preventDefault();
  $("drop").classList.add("over");
}));
["dragleave", "drop"].forEach(t => document.addEventListener(t, (e) => {
  e.preventDefault();
  if (t === "dragleave" && e.relatedTarget) return;
  $("drop").classList.remove("over");
}));
document.addEventListener("drop", (e) => {
  const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith("image/"));
  if (f) loadFile(f);
});
document.addEventListener("paste", (e) => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (item) loadFile(item.getAsFile());
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Delete" || e.key === "Backspace") && state.selected >= 0 && !e.target.matches?.("textarea, input[type=text]")) {
    e.preventDefault();
    deleteSelected();
  }
});

$("strength").addEventListener("input", (e) => { $("strengthOut").textContent = e.target.value; render(); });
$("padding").addEventListener("input", (e) => {
  $("paddingOut").textContent = e.target.value + "%";
  for (const r of state.regions) if (r.auto) Object.assign(r, padFace(state.faces[r.faceIndex]));
  render();
});
let sensTimer;
$("sensitivity").addEventListener("input", (e) => {
  $("sensitivityOut").textContent = e.target.value;
  clearTimeout(sensTimer);
  sensTimer = setTimeout(redetect, 350);
});
document.querySelectorAll('input[name=effect], input[name=shape]').forEach(el => el.addEventListener("change", render));
$("showFrames").addEventListener("change", render);
$("delSel").addEventListener("click", deleteSelected);
$("allOn").addEventListener("click", () => { state.regions.forEach(r => r.on = true); render(); showCount(); });
$("allOff").addEventListener("click", () => { state.regions.forEach(r => r.on = false); render(); showCount(); });
window.addEventListener("resize", render);

$("save").addEventListener("click", () => {
  if (!state.img) return;
  const fmt = document.querySelector('input[name=fmt]:checked').value;
  const out = document.createElement("canvas");
  out.width = state.img.width; out.height = state.img.height;
  paint(out.getContext("2d"), false);
  out.toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const base = state.fileName.replace(/\.[^.]+$/, "");
    a.download = `${base}_mosaic.${fmt === "jpeg" ? "jpg" : "png"}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, `image/${fmt}`, 0.92);
});

// Warm up the model in the background so the first detection is faster.
getDetector().catch(() => {});

// Offline support: cache the app and model after the first visit.
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW registration failed", e));
}
</script>
</body>
</html>
